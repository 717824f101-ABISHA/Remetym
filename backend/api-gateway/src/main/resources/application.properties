server.port=8080
spring.application.name=api-gateway
spring.main.web-application-type=reactive

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Auth Routes
spring.cloud.gateway.routes[0].id=auth-service-auth
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth,/api/auth/**

spring.cloud.gateway.routes[1].id=auth-service-users
spring.cloud.gateway.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users,/api/users/**

spring.cloud.gateway.routes[2].id=auth-service-admin
spring.cloud.gateway.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/admin,/api/admin/**

# Medicine Routes
